<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마라톤 레이싱화 | 나에게 맞는 레이싱화는?</title>
  <meta name="description" content="세계 마라톤 챔피언들이 신는 고성능 레이싱화를 확인하세요" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <script defer src="../assets/js/data/brands.js"></script>
  <script defer src="../assets/js/data/shoes.js"></script>
  <script defer src="../assets/js/data/athletes.js"></script>
  <script defer src="../assets/js/core/utils.js"></script>
  <style>
    .shoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin: 32px 0;
    }

    .shoe-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .shoe-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .shoe-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: var(--muted);
    }

    .shoe-card-info {
      padding: 20px;
    }

    .shoe-card h3 {
      margin: 0 0 4px 0;
      font-size: 18px;
    }

    .shoe-brand {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .shoe-features {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .shoe-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px;
    }

    .shoe-price {
      font-weight: 600;
      font-size: 16px;
    }

    .shoe-rating {
      color: #fbbf24;
      font-size: 14px;
    }

    .used-by {
      background: var(--muted);
      opacity: 0.1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">Marathon Face Match</div>
      <nav>
        <a href="./index.html">홈</a>
        <a href="./athletes-all.html">선수</a>
        <a href="./shoes-all.html">신발</a>
        <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="hero card">
      <h1>마라톤 레이싱화</h1>
      <p>세계 마라톤 챔피언들이 신는 고성능 레이싱화를 확인하세요!</p>

      <div class="shoes-grid">
        <script>
          // 동적으로 신발 카드 생성
          if (typeof window.MFMShoes !== 'undefined' && typeof window.MFMAthletes !== 'undefined') {
            window.MFMShoes.forEach(shoe => {
              // 이 신발을 신는 선수 찾기
              const usedByAthletes = window.MFMAthletes
                .filter(a => a.shoeId === shoe.id)
                .map(a => a.name)
                .join(', ');
              
              const html = `
                <div class="shoe-card">
                  <img src="../assets/images/shoes/${shoe.image}" alt="${shoe.name}" />
                  <div class="shoe-card-info">
                    <p class="shoe-brand">${shoe.brand}</p>
                    <h3>${shoe.name}</h3>
                    <p class="shoe-features">${shoe.features}</p>
                    <div class="shoe-footer">
                      <span class="shoe-price">${shoe.price}</span>
                      <span class="shoe-rating">⭐ ${shoe.rating}</span>
                    </div>
                    <div class="used-by">
                      <strong>사용 선수:</strong><br />
                      ${usedByAthletes}
                    </div>
                  </div>
                </div>
              `;
              document.write(html);
            });
          }
        </script>
      </div>

      <div class="button-row">
        <a class="btn" href="./index.html">← 홈으로 돌아가기</a>
        <a class="btn" href="./athletes-all.html">← 선수 보기</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="./privacy/index.html">개인정보 처리방침</a>
      <a href="./terms/index.html">이용약관</a>
      <a href="./cookie/index.html">쿠키 정책</a>
    </div>
  </footer>

  <script>
    // 테마 토글
    function initThemeToggle() {
      const themeToggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("theme") || "dark-mode";
      
      document.body.className = savedTheme;
      updateThemeToggleIcon(savedTheme);
      
      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          const currentTheme = document.body.className;
          const newTheme = currentTheme === "dark-mode" ? "light-mode" : "dark-mode";
          
          document.body.className = newTheme;
          localStorage.setItem("theme", newTheme);
          updateThemeToggleIcon(newTheme);
        });
      }
    }

    function updateThemeToggleIcon(theme) {
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        themeToggle.textContent = theme === "dark-mode" ? "☀️" : "🌙";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initThemeToggle();
    });
  </script>
</body>
</html>
