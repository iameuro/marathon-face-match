<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나에게 맞는 레이싱화는?</title>
  <meta name="description" content="당신의 얼굴과 닮은 마라톤 선수가 신는 레이싱화를 추천받으세요" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <script defer src="../assets/js/data/brands.js"></script>
  <script defer src="../assets/js/data/shoes.js"></script>
  <script defer src="../assets/js/data/athletes.js"></script>
  <script defer src="../assets/js/core/utils.js"></script>
  <script defer src="../assets/js/core/app.js"></script>
  <!-- Face Detection Library -->
  <script async src="https://cdn.jsdelivr.net/npm/ml5@0.12.0/dist/ml5.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">Marathon Face Match</div>
      <nav>
        <a href="./index.html">홈</a>
        <a href="./athletes-all.html">선수</a>
        <a href="./shoes-all.html">신발</a>
        <div class="nav-controls">
          <button id="language-toggle" aria-label="Switch language">EN</button>
          <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="hero card">
      <h1>나에게 맞는 레이싱화는?</h1>
      <p>당신의 얼굴과 닮은 선수가 신는 신발을 추천받으세요!</p>
      
      <!-- 카메라 섹션 -->
      <div class="camera-section">
        <h2>얼굴 매칭</h2>
        <div class="camera-container">
          <video id="camera-video" width="320" height="240" autoplay></video>
          <canvas id="camera-canvas" style="display:none;"></canvas>
        </div>
        <div class="button-row">
          <button id="camera-start" class="btn">📷 Step 1: 카메라 시작</button>
          <button id="camera-capture" class="btn">✨ Step 2: 캡처 & 분석</button>
        </div>
        <p id="face-detection-status" style="text-align: center; margin-top: 12px; color: var(--muted); font-size: 12px;"></p>
      </div>

      <!-- 매칭 결과 섹션 -->
      <div id="match-result" class="match-result-section" style="display: none;">
        <!-- 얼굴 비교 섹션 -->
        <div class="face-comparison-section">
          <div class="face-comparison-container">
            <div class="face-comparison-item">
              <div class="face-image-wrapper">
                <img id="captured-face-image" src="" alt="당신의 얼굴" />
              </div>
              <p class="face-label">당신의 얼굴</p>
            </div>
            
            <div class="face-similarity-display">
              <div class="similarity-badge">
                <span id="result-similarity">00</span>%
              </div>
              <p>유사도</p>
            </div>
            
            <div class="face-comparison-item">
              <div class="face-image-wrapper">
                <img id="matched-athlete-face" src="" alt="닮은 선수" />
              </div>
              <p class="face-label" id="matched-athlete-name-label">선수명</p>
            </div>
          </div>
        </div>

        <h2 style="margin-top: 32px;">🎯 당신을 닮은 선수</h2>
        
        <div class="athlete-match-card">
          <div class="match-athlete-image">
            <img id="result-athlete-image" src="" alt="매칭된 선수" />
          </div>
          <div class="match-athlete-info">
            <h3 id="result-athlete-name"></h3>
            <p id="result-athlete-nation" class="athlete-nation"></p>
            <p id="result-athlete-bio" class="athlete-bio"></p>
            
            <div class="achievements-section">
              <h4>주요 성적</h4>
              <p id="result-athlete-achievements" class="athlete-achievements"></p>
            </div>
          </div>
        </div>

        <h2 style="margin-top: 32px;">👟 추천 신발</h2>
        
        <div class="shoe-recommendation-card">
          <div class="shoe-image-section">
            <img id="result-shoe-image" src="" alt="추천 신발" />
          </div>
          <div class="shoe-info-section">
            <h3 id="result-shoe-name"></h3>
            <p id="result-shoe-brand" class="shoe-brand"></p>
            <p id="result-shoe-features" class="shoe-features"></p>
            <div class="shoe-details">
              <p><strong>가격:</strong> <span id="result-shoe-price"></span></p>
              <div class="shoe-rating">
                <span>⭐ <span id="result-shoe-rating"></span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="button-row" style="margin-top: 24px;">
          <button id="reset-match" class="btn">다시 시도</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="./privacy/index.html">개인정보 처리방침</a>
      <a href="./terms/index.html">이용약관</a>
      <a href="./cookie/index.html">쿠키 정책</a>
    </div>
  </footer>
</body>
</html>
