<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marathon Face Match</title>
  <meta name="description" content="A running shoe recommendation site combining face match and foot-profile input" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <script defer src="../assets/js/data/brands.js"></script>
  <script defer src="../assets/js/data/shoes.js"></script>
  <script defer src="../assets/js/data/athletes.js"></script>
  <script defer src="../assets/js/core/utils.js"></script>
  <script defer src="../assets/js/core/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">Marathon Face Match</div>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./athletes/sifan-hassan.html">Athletes</a>
        <a href="./brands/nike.html">Brands</a>
        <a href="./guides/carbon-shoes.html">Guides</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="hero card">
      <h1>Marathon Face Match</h1>
      <p>Match your face and foot type to find your perfect marathon shoe.</p>
      
      <!-- Camera Section -->
      <div class="camera-section">
        <h2>Face Matching</h2>
        <div class="camera-container">
          <video id="camera-video" width="320" height="240" autoplay></video>
          <canvas id="camera-canvas" style="display:none;"></canvas>
        </div>
        <div class="button-row">
          <button id="camera-start" class="btn">Start Camera</button>
          <button id="camera-stop" class="btn">Stop Camera</button>
          <button id="camera-capture" class="btn">Capture Snapshot</button>
        </div>
      </div>

      <div class="button-row">
        <a class="btn" href="./athletes/sifan-hassan.html">View Athletes</a>
        <a class="btn" href="../ko/index.html">한국어</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="./privacy/index.html">Privacy</a>
      <a href="./terms/index.html">Terms</a>
      <a href="./cookie/index.html">Cookie Policy</a>
    </div>
  </footer>
</body>
</html>
