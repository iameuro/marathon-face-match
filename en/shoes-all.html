<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marathon Racing Shoes | What Racing Shoe Is Right For Me?</title>
  <meta name="description" content="Discover the high-performance racing shoes worn by world marathon champions" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <script defer src="../assets/js/data/brands.js"></script>
  <script defer src="../assets/js/data/shoes.js"></script>
  <script defer src="../assets/js/data/athletes.js"></script>
  <script defer src="../assets/js/core/utils.js"></script>
  <style>
    .shoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin: 32px 0;
    }

    .shoe-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .shoe-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .shoe-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: var(--muted);
    }

    .shoe-card-info {
      padding: 20px;
    }

    .shoe-card h3 {
      margin: 0 0 4px 0;
      font-size: 18px;
    }

    .shoe-brand {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .shoe-features {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .shoe-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px;
    }

    .shoe-price {
      font-weight: 600;
      font-size: 16px;
    }

    .shoe-rating {
      color: #fbbf24;
      font-size: 14px;
    }

    .used-by {
      background: var(--muted);
      opacity: 0.1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      margin-top: 12px;
    }
  </style>
  <style>
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: var(--panel);
      border-radius: 16px;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 0;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 32px;
      color: var(--text);
      cursor: pointer;
      z-index: 1001;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.8;
    }

    .modal-close:hover {
      opacity: 1;
    }

    .modal-body {
      padding: 32px;
    }

    .shoe-detail {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 32px;
      align-items: start;
    }

    .shoe-detail img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      background: var(--muted);
    }

    .shoe-info .brand-tag {
      background: var(--accent);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 8px;
    }

    .shoe-info h2 {
      margin: 0 0 16px 0;
      font-size: 28px;
    }

    .shoe-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .shoe-meta .rating {
      color: #fbbf24;
      font-size: 18px;
    }

    .shoe-meta .price {
      font-size: 20px;
      font-weight: 600;
    }

    .shoe-info .features {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
      color: var(--text);
    }

    .athletes-section h3 {
      margin: 0 0 16px 0;
      font-size: 20px;
    }

    .athletes-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .athlete-mini-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--muted);
      opacity: 0.05;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .athlete-mini-card img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
    }

    .athlete-mini-card .info {
      flex: 1;
    }

    .athlete-mini-card .name {
      font-weight: 600;
      font-size: 14px;
      margin: 0;
    }

    .athlete-mini-card .nation {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    @media (max-width: 768px) {
      .shoe-detail {
        grid-template-columns: 1fr;
      }

      .modal-body {
        padding: 20px;
      }

      .shoe-detail img {
        height: 200px;
      }

      .athletes-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">Marathon Face Match</div>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./athletes-all.html">Athletes</a>
        <a href="./shoes-all.html">Shoes</a>
        <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="hero card">
      <h1>Marathon Racing Shoes</h1>
      <p>Discover the high-performance racing shoes worn by world marathon champions!</p>

      <div class="shoes-grid">
        <script>
          // Dynamically generate shoe cards
          if (typeof window.MFMShoes !== 'undefined' && typeof window.MFMAthletes !== 'undefined') {
            window.MFMShoes.forEach(shoe => {
              // Find athletes wearing this shoe
              const usedByAthletes = window.MFMAthletes
                .filter(a => a.shoeId === shoe.id)
                .map(a => a.name)
                .join(', ');
              
              const html = `
                <div class="shoe-card">
                  <img src="../assets/images/shoes/${shoe.image}" alt="${shoe.name}" />
                  <div class="shoe-card-info">
                    <p class="shoe-brand">${shoe.brand}</p>
                    <h3>${shoe.name}</h3>
                    <p class="shoe-features">${shoe.features}</p>
                    <div class="shoe-footer">
                      <span class="shoe-price">${shoe.price}</span>
                      <span class="shoe-rating">⭐ ${shoe.rating}</span>
                    </div>
                    <div class="used-by">
                      <strong>Worn by:</strong><br />
                      ${usedByAthletes}
                    </div>
                  </div>
                </div>
              `;
              document.write(html);
            });
          }
        </script>
      </div>

      <div class="button-row">
        <a class="btn" href="./index.html">← Back to Home</a>
        <a class="btn" href="./athletes-all.html">← View Athletes</a>
      </div>
    </section>
  </main>

  <!-- Shoe Detail Modal -->
  <div id="shoe-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      <div class="modal-body">
        <div class="shoe-detail">
          <img id="modal-shoe-image" src="" alt="" />
          <div class="shoe-info">
            <p id="modal-shoe-brand" class="brand-tag"></p>
            <h2 id="modal-shoe-name"></h2>
            <div class="shoe-meta">
              <span id="modal-shoe-rating" class="rating">★★★★★</span>
              <span id="modal-shoe-price" class="price"></span>
            </div>
            <p id="modal-shoe-features" class="features"></p>
            <div class="athletes-section">
              <h3>Athletes Using This Shoe</h3>
              <div id="modal-athletes-list" class="athletes-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <a href="./privacy/index.html">Privacy</a>
      <a href="./terms/index.html">Terms</a>
      <a href="./cookie/index.html">Cookie Policy</a>
    </div>
  </footer>

  <script>
    function initThemeToggle() {
      const themeToggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("theme") || "dark-mode";
      
      document.body.className = savedTheme;
      updateThemeToggleIcon(savedTheme);
      
      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          const currentTheme = document.body.className;
          const newTheme = currentTheme === "dark-mode" ? "light-mode" : "dark-mode";
          
          document.body.className = newTheme;
          localStorage.setItem("theme", newTheme);
          updateThemeToggleIcon(newTheme);
        });
      }
    }

    function updateThemeToggleIcon(theme) {
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        themeToggle.textContent = theme === "dark-mode" ? "☀️" : "🌙";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initThemeToggle();
      initShoeModals();
    });

    function initShoeModals() {
      const modal = document.getElementById('shoe-modal');
      const closeBtn = modal.querySelector('.modal-close');
      
      // Close modal when clicking close button or overlay
      closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.style.display = 'none';
        }
      });
      
      // Add click events to shoe cards
      document.querySelectorAll('.shoe-card').forEach((card, index) => {
        card.style.cursor = 'pointer';
        card.addEventListener('click', () => {
          showShoeModal(window.MFMShoes[index]);
        });
      });
    }

    function showShoeModal(shoe) {
      const modal = document.getElementById('shoe-modal');
      
      // Set shoe info
      document.getElementById('modal-shoe-image').src = `../assets/images/shoes/${shoe.image}`;
      document.getElementById('modal-shoe-image').alt = shoe.name;
      document.getElementById('modal-shoe-brand').textContent = shoe.brand;
      document.getElementById('modal-shoe-name').textContent = shoe.name;
      document.getElementById('modal-shoe-rating').textContent = '★'.repeat(Math.floor(shoe.rating)) + (shoe.rating % 1 ? '☆' : '');
      document.getElementById('modal-shoe-price').textContent = shoe.price;
      document.getElementById('modal-shoe-features').textContent = shoe.features;
      
      // Set athletes who use this shoe
      const athletesList = document.getElementById('modal-athletes-list');
      const athletes = window.MFMAthletes.filter(a => a.shoeId === shoe.id);
      
      if (athletes.length > 0) {
        const athletesHtml = athletes.map(athlete => `
          <div class="athlete-mini-card">
            <img src="../assets/images/athletes/${athlete.image}" alt="${athlete.name}" />
            <div class="info">
              <p class="name">${athlete.name}</p>
              <p class="nation">🌍 ${athlete.nation}</p>
            </div>
          </div>
        `).join('');
        athletesList.innerHTML = athletesHtml;
      } else {
        athletesList.innerHTML = '<p>No athletes using this shoe.</p>';
      }
      
      // Show modal
      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
